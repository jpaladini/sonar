<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sonar — Call Intelligence</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffffff'/%3E%3Crect x='7' y='13' width='3' height='7' rx='1.5' fill='%230a0a0c'/%3E%3Crect x='12' y='9' width='3' height='14' rx='1.5' fill='%230a0a0c'/%3E%3Crect x='17' y='11' width='3' height='10' rx='1.5' fill='%230a0a0c'/%3E%3Crect x='22' y='8' width='3' height='16' rx='1.5' fill='%230a0a0c'/%3E%3C/svg%3E"

      document.documentElement.dataset.theme =

    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

         network, self-host: download IBM Plex Sans 400/500/600/700 and

         replace this link with @font-face rules in index.css. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"

    />

  <body>
