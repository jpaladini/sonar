# PR validation: frontend build + BFF tests + bundle validate. Register this
# pipeline as a Build Validation policy on the dev branch in ADO repo settings
# (ADO ignores a `pr:` trigger for Azure Repos; the policy is what runs it).
#
# Pipeline variables: DATABRICKS_HOST, DATABRICKS_TOKEN (secret).
trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: Use Node 20

  - script: |
      set -euo pipefail
      cd frontend
      npm ci
      npm run build
    displayName: Build frontend

  - script: |
      set -euo pipefail
      pip install -r requirements-dev.txt
      python -m pytest tests/ -q
    displayName: Run BFF tests

  - script: |
      set -euo pipefail
      curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      databricks bundle validate -t dev
    displayName: Validate bundle
    env:
      DATABRICKS_HOST: $(DATABRICKS_HOST)
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
